[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-gate"
version = "0.1.0"
description = "Does your ML-for-science model beat a trivial baseline on a blind holdout?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cleiton Augusto Corrêa Bezerra" }]
keywords = ["validation", "machine-learning", "science", "reproducibility",
            "pre-registration", "baseline", "holdout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cleitonaugusto/validation-gate"
"Why this exists" = "https://cleitonaugusto.github.io/validation/"

[project.scripts]
validation-gate = "validation_gate.cli:main"

[tool.setuptools.packages.find]
include = ["validation_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
